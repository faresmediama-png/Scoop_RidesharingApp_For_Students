name: vaigo_app
description: A new Flutter application.

version: 1.0.0+1

environment:
  sdk: ">=2.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  bottom_navy_bar: ^6.1.0
  date_picker_timeline: ^1.0.6
  google_maps_flutter: ^2.5.0  # أضيفت من أجل الخريطة الحقيقية
  geolocator: ^10.1.0          # أضيفت من أجل تتبع موقع GPS الحقيقي

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Quicksand
      fonts:
        - asset: fonts/Quicksand-Bold.ttf
          weight: 700
        - asset: fonts/Quicksand-Light.ttf
          weight: 300
        - asset: fonts/Quicksand-Medium.ttf
          weight: 500
        - asset: fonts/Quicksand-Regular.ttf
          weight: 400
        - asset: fonts/Quicksand-SemiBold.ttf
          weight: 600

flutter_icons:
  image_path: "assets/images/1794256694216.jpg"
  android: true
  ios: true
