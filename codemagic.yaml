workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 30
    environment:
      flutter: 3.24.5
    working_directory: flutter-app
    scripts:
      - name: Clean project cache
        script: |
          flutter clean
      - name: Get flutter packages
        script: |
          flutter pub get
      - name: Fix and generate Android wrapper
        script: |
          cd android
          gradle wrapper --gradle-version 7.5
          cd ..
      - name: Build APK for Vaigo
        script: |
          flutter build apk --release --no-pub
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
