workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Get flutter packages
        script: |
          cd Scoop_RidesharingApp_For_Students
          flutter pub get
      - name: Build APK for Vaigo
        script: |
          cd Scoop_RidesharingApp_For_Students
          flutter build apk --release
    artifacts:
      - Scoop_RidesharingApp_For_Students/build/app/outputs/flutter-apk/app-release.apk

