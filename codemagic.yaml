workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 30
    environment:
      flutter: 3.24.5
    working_directory: flutter-app
    scripts:
      - name: Get flutter packages
        script: |
          flutter pub get
      - name: Build APK for Vaigo
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
